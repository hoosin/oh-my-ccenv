name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write # 添加此项以支持 NPM Provenance

jobs:
  release:
    # workflow_dispatch 走手动 bump；PR 合并时必须带 release:* 标签才发版
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && (
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')
      ))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Determine bump type
        id: bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            echo "Bump type (manual): ${{ inputs.bump }}"
          else
            if echo "$LABELS" | grep -q '"release:major"'; then
              echo "bump=major" >> "$GITHUB_OUTPUT"
            elif echo "$LABELS" | grep -q '"release:minor"'; then
              echo "bump=minor" >> "$GITHUB_OUTPUT"
            elif echo "$LABELS" | grep -q '"release:patch"'; then
              echo "bump=patch" >> "$GITHUB_OUTPUT"
            else
              echo "No release:* label found on merged PR — should be guarded by job if:" >&2
              exit 1
            fi
            echo "Bump type (from PR label): $(cat "$GITHUB_OUTPUT" | grep ^bump= | cut -d= -f2)"
          fi

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          pnpm version ${{ steps.bump.outputs.bump }}
          echo "PKG_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_ENV
          echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Verify npm auth and package state
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::group::token sanity"
          echo "NPM_TOKEN length: ${#NODE_AUTH_TOKEN}"
          echo "NPM_TOKEN prefix: ${NODE_AUTH_TOKEN:0:4}..."
          echo "::endgroup::"
          echo "::group::npm identity"
          npm whoami
          echo "::endgroup::"
          echo "::group::publishing $PKG_NAME@$PKG_VERSION"
          echo "Existing versions on registry:"
          npm view "$PKG_NAME" versions --json 2>/dev/null || echo "(package not yet published)"
          echo "::endgroup::"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --provenance

      - name: Push commit and tag to main
        run: |
          git push --follow-tags origin main
          echo "Published $PKG_NAME@$PKG_VERSION"
          echo "https://www.npmjs.com/package/$PKG_NAME/v/$PKG_VERSION"

      - name: Sync dev with main
        # 把 main 强推到 dev，让下一轮 PR 不会把 bump 反向 diff 带回去。
        # --force-with-lease 防止覆盖别人在 dev 上的并发推送（会让这步失败，需要手动处理）。
        run: |
          git fetch origin dev || true
          git push --force-with-lease origin main:dev
