name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write # 添加此项以支持 NPM Provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          pnpm version ${{ inputs.bump }}
          echo "PKG_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_ENV
          echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Verify npm auth and package state
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          echo "::group::npm identity"
          npm whoami
          echo "::endgroup::"
          echo "::group::publishing $PKG_NAME@$PKG_VERSION"
          echo "Existing versions on registry:"
          npm view "$PKG_NAME" versions --json 2>/dev/null || echo "(package not yet published)"
          echo "::endgroup::"

      - name: Publish to npm
        run: pnpm publish --no-git-checks --provenance

      - name: Push commit and tag
        run: |
          git push --follow-tags
          echo "Published $PKG_NAME@$PKG_VERSION"
          echo "https://www.npmjs.com/package/$PKG_NAME/v/$PKG_VERSION"
